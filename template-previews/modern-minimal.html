<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>现代极简 - 稿纸工坊</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .container {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #FAFAFA;
    }
    .lines-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .title-overlay {
      position: absolute;
      bottom: 80px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 72px;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: rgba(0, 0, 0, 0.6);
      font-family: 'STKaiti', 'KaiTi', serif;
    }
    .brand {
      position: absolute;
      top: 40px;
      right: 60px;
      font-size: 28px;
      color: rgba(0, 0, 0, 0.2);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="lines-layer" xmlns="http://www.w3.org/2000/svg" width="1080" height="1080">
      
    </svg>
    <div class="brand">稿纸工坊</div>
    <div class="title-overlay">现代极简</div>
  </div>
</body>
</html>
